# Local development infrastructure only.
# Production Postgres is Neon and Redis is the platform's managed instance; this
# exists so developers and CI have real services to run against.

services:
  postgres:
    image: postgres:16-alpine
    container_name: edugear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edugear
      POSTGRES_PASSWORD: edugear
      POSTGRES_DB: edugear
    ports:
      # Non-default host port to avoid clashing with other local Postgres instances.
      - '55432:5432'
    volumes:
      - edugear_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edugear -d edugear']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edugear-redis
    restart: unless-stopped
    # Rate-limit counters and the permission cache are both rebuildable, so an
    # in-memory-only Redis is fine here. No persistence to lose.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # Non-default host port, matching the Postgres choice above.
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edugear_pgdata:
